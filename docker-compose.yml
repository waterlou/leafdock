services:
  leafdock:
    build: .
    image: ghcr.io/waterlou/leafdock:main
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
    environment:
      - HTTP_PORT=${HTTP_PORT:-80}
      - MANAGEMENT_API_KEY=${MANAGEMENT_API_KEY:?set MANAGEMENT_API_KEY in .env}
      - PORT=3001
      - DATA_DIR=/data
      - CADDY_ADMIN_URL=http://localhost:2019
      - DOCKER_SOCKET=/var/run/docker.sock
      - APP_VOLUME=leafdock_app_data
    volumes:
      - app_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  app_data:
    # Pinned so the physical volume is leafdock_app_data regardless of the
    # compose project directory name — app containers mount it via APP_VOLUME.
    name: leafdock_app_data

networks:
  default:
    name: leafdock_default
